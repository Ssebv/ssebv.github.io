<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Sebastián Allende</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f5bd7'/%3E%3Ctext x='50' y='68' font-family='Helvetica,Arial,sans-serif' font-size='48' font-weight='700' fill='%23fff' text-anchor='middle'%3ESA%3C/text%3E%3C/svg%3E">
<!-- Served at any missing path, so every URL here is absolute -->
<link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="lang-switch" aria-label="Language">
  <a href="/" hreflang="en" aria-current="true" id="lang-en">EN</a>
  <a href="/es/" hreflang="es" id="lang-es">ES</a>
</nav>

<button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Dark theme" title="Dark theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<a class="skip" href="#main">Skip to content</a>

<div class="wrap">
  <main id="main" class="not-found">
    <span class="brand" aria-hidden="true">SA</span>
    <p class="not-found-code">Error 404</p>
    <h1>Page not found</h1>
    <p class="role">The address may have changed, or it never existed.</p>
    <p class="loc" lang="es">Esta página no existe. <a href="/es/">Ir al inicio en español</a>.</p>
    <nav class="links" aria-label="Where to go">
      <a class="primary" href="/">Home page</a>
      <a href="/#projects">Projects</a>
      <a href="/writing/">Writing</a>
      <a href="mailto:sallendec@outlook.com">Email</a>
    </nav>
  </main>
</div>

<script>
(function(){
  var b=document.getElementById('themeToggle');if(!b)return;
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var cur=function(){return document.documentElement.getAttribute('data-theme')||(mq.matches?'dark':'light');};
  var sync=function(){b.setAttribute('aria-pressed',cur()==='dark'?'true':'false');};
  sync();
  if(mq.addEventListener)mq.addEventListener('change',sync);
  b.addEventListener('click',function(){
    var next=cur()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
    sync();
  });
})();
</script>
<script>
/* GitHub Pages serves this one page for every missing URL; under /es/ it switches to Spanish. */
(function(){
  if (location.pathname.indexOf('/es/') !== 0) return;
  var d = document, set = function(sel, txt, href){ var e = d.querySelector(sel); if (!e) return; e.textContent = txt; if (href) e.setAttribute('href', href); };
  d.documentElement.lang = 'es';
  d.title = 'Página no encontrada — Sebastián Allende';
  set('.skip', 'Saltar al contenido');
  set('.not-found-code', 'Error 404');
  set('.not-found h1', 'Página no encontrada');
  set('.not-found .role', 'La dirección cambió o nunca existió.');
  var loc = d.querySelector('.not-found .loc'); loc.removeAttribute('lang');
  loc.innerHTML = 'This page does not exist. <a href="/" lang="en">Go to the English home page</a>.';
  loc.setAttribute('lang', 'en');
  var links = d.querySelectorAll('.not-found .links a');
  [['Inicio', '/es/'], ['Proyectos', '/es/#proyectos'], ['Escritos', '/es/writing/'], ['Correo', null]].forEach(function(x, i){
    links[i].textContent = x[0]; if (x[1]) links[i].setAttribute('href', x[1]);
  });
  d.querySelector('.not-found .links').setAttribute('aria-label', 'Dónde ir');
  d.getElementById('lang-en').removeAttribute('aria-current');
  d.getElementById('lang-es').setAttribute('aria-current', 'true');
  var t = d.getElementById('themeToggle'); t.setAttribute('aria-label', 'Tema oscuro'); t.title = 'Tema oscuro';
})();
</script>
</body>
</html>
