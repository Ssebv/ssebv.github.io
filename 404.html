<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Sebastián Allende</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f5bd7'/%3E%3Ctext x='50' y='68' font-family='Helvetica,Arial,sans-serif' font-size='48' font-weight='700' fill='%23fff' text-anchor='middle'%3ESA%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#fff; --fg:#14161b; --muted:#596072; --accent:#2f5bd7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1014; --fg:#e8eaf0; --muted:#99a1b3; --accent:#7da3ff; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); text-align:center; padding:24px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
  h1 { font-size:40px; letter-spacing:-.02em; margin:0 0 10px; }
  p { color:var(--muted); margin:0 0 26px; }
  a { display:inline-block; padding:10px 20px; border-radius:999px; background:var(--accent);
      color:#fff; text-decoration:none; font-weight:500; }
</style>
</head>
<body>

<nav class="lang-switch" aria-label="Language">
  <a href="./" hreflang="en" aria-current="true">EN</a>
  <a href="./es/" hreflang="es">ES</a>
</nav>


<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

  <div>
    <h1>404</h1>
    <p>That page doesn't exist.</p>
    <a href="/">Back to home</a>
  </div>
<script>
(function(){
  var b=document.getElementById('themeToggle');if(!b)return;
  b.addEventListener('click',function(){
    var sysDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    var cur=document.documentElement.getAttribute('data-theme')||(sysDark?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();
</script>
</body>
</html>
